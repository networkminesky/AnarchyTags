# ---------------------------------- #
#         AnarchyTags Config         #
# ---------------------------------- #
# Estilo DisplayTags: TextDisplay virtual via PacketEvents (Folia 26.3)
# Recarregar: /anarchytags reload

nametags:
  enabled: true

  # false = o jogador não vê a própria tag acima da cabeça
  show-self: false

  # Intervalo de atualização do texto (segundos). Valores maiores = menos pacotes.
  # Não afeta ícone de voz ({voiceicon} / %atvc_*%): mudanças de voz atualizam na hora.
  update-interval: 5

  # Distância máxima (blocos) para ver a tag
  visibility-distance: 64

  # Legado: atraso extra antes de tags/tab (0 = imediato após carregar o mundo).
  join-delay-seconds: 0

  # Ticks após carregar o mundo antes do init (0 = imediato).
  join-init-delay-ticks: 0

  hide-in-spectator: true
  hide-in-vanish: true

  display:
    # Uma linha: prefixos (PAPI relacional) + nick. {player} = nome do alvo da tag.
    lines:
      - "<white>%luckperms_prefix%{player}%atvc_icon%"
      - "%anarchyeconomy_formatted_tab%%anarchyclans_tab%"

    # Padrão do servidor; cada jogador pode mudar em /config → Visual do Nick
    text-shadow: false
    see-through: true
    text-alignment: center

    # default | transparent | hex — padrão do servidor; fundo escuro on/off no /config
    background: default

    billboard: center

    translation:
      x: 0
      y: 0.20
      z: 0

    scale:
      x: 1
      y: 1
      z: 1

# Ícones de voz: {voiceicon} nas linhas + placeholders %atvc_*% (head_url / PAPI).
voice-chat:
  enabled: true
  use-placeholder: false
  placeholder: "%atvc_%"
  talk-timeout-ms: 350
  talking: " <head_url:https://textures.minecraft.net/texture/891c851d84187288924efb13869ae5037abc324264bc95552fecfd7de5611d92>"
  whispering: " 🔉"
  quiet: " <head_url:https://textures.minecraft.net/texture/63b402e51fba28d9843f153669640049d63d71463dc1f915f3ce5cca734b0a90>"
  # Dentro de um grupo do Simple Voice Chat e sem falar. Falando continua talking/whispering.
  group: " <head_url:https://textures.minecraft.net/texture/6cf0575c8259bf6906e47052918d7f086103b3c4078e319202b5f3b34b210011>"
  disabled: " <head_url:https://textures.minecraft.net/texture/5f4b280f9a43df3b67e1ba112b34a527817938270931a9b445996424b2c7a68d>"
  not-installed: " <head_url:https://textures.minecraft.net/texture/986954486f361ecd2fa2f95a36da532d9f732c0d1868b30da596a166cd46bd5a>"

# Scoreboard lateral (estilo DonutSMP). Título e fixed-lines são sempre exibidos quando a scoreboard está ativa.
# Cada entrada em toggles vira opção no /config → Scoreboard.
scoreboard:
  enabled: true
  update-interval-seconds: 2
  title: "&#a3feffᴍɪɴᴇsᴋʏ.ᴄᴏᴍ.ʙʀ"
  fixed-lines:
    - "&f<head:%player%> %displayname%"
  toggles:
    money:
      label: "Saldo ($)"
      default: true
      line: "&#9dff00&l$ &f%anarchyeconomy_formatted%"
    shards:
      label: "Shards"
      default: true
      line: "&#e436ff⚗ &f%anarchyeconomy_shards_formatted%"
    kills:
      label: "Kills"
      default: true
      line: "&fKills: &7%statistic_player_kills%"
    deaths:
      label: "Mortes"
      default: true
      line: "&fMortes: &7%statistic_deaths%"
    playtime:
      label: "Tempo jogado"
      default: true
      line: "&fPlaytime: &7%statistic_time_played%"
    ping:
      label: "Ping"
      default: true
      line: "&f<mineskin:4d44c0c505744069a3b09d5ff5fb3960> &f%ping%ms"

# Ordem do tab, no mesmo estilo do sorting-types do TAB.
# O jogador só pode estar em um time: este plugin esconde a nametag vanilla e ordena o tab.
# Recarregar: /anarchytags reload
sorting:
  enabled: true

  # Segundos entre recálculos de cargo. Sem pacote se nada mudou.
  update-interval: 10

  # Pares viewer→alvo aplicados por tick do scheduler (~1/s com 20 ticks).
  sync-per-tick: 4

  # true = prefixo/sufixo no tab via PAPI (mais pesado). false = só ordena (prefixo na nametag 3D).
  apply-prefix: false

  # Prefixo/sufixo do tab. Vazio = não escreve nada. LuckPerms por padrão.
  prefix: "%luckperms_prefix%"
  suffix: "%luckperms_suffix%"

  # Primeiro critério manda mais. Tipos:
  #   PLACEHOLDER_HIGH_TO_LOW:%luckperms_highest_group_weight%  (peso maior primeiro)
  #   PLACEHOLDER_LOW_TO_HIGH:%placeholder%
  #   PLACEHOLDER_A_TO_Z:%player%
  #   PLACEHOLDER_Z_TO_A:%player%
  #   GROUPS:dono,diretor,admin,mod,helper,vip,default
  #     (primary group do LuckPerms, do cargo mais alto ao mais baixo)
  types:
    - "PLACEHOLDER_HIGH_TO_LOW:%luckperms_highest_group_weight%"
    - "PLACEHOLDER_A_TO_Z:%player%"

# /escondernick: nick ofuscado (&k), sem prefixo LuckPerms, dinheiro ou clã.
# Tempo é uma cota diária (pode ligar/desligar; o relógio só corre enquanto estiver ativo).
nick-hide:
  # Minutos por dia (padrão, se o jogador não casar com group-durations)
  duration-minutes: 20
  # Aviso quando faltar este tempo (90 = 1 minuto e 30s)
  warn-remaining-seconds: 90
  # Minutos por grupo LuckPerms. Usa o maior entre os grupos do jogador.
  # -1 = ilimitado. Se nenhum grupo listado casar, usa duration-minutes.
  group-durations:
    default: 20
    vip: 40
    mvp: 60
    admin: -1