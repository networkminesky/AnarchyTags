name: AnarchyTags
version: '${version}'
description: Nametags em TextDisplay virtual (estilo DisplayTags) com PlaceholderAPI relacional e Folia.
main: anarchy.minesky.tags.AnarchyTags
api-version: '26.3'
folia-supported: true
authors: [Bruno C.]
depend: [packetevents, PlaceholderAPI, voicechat]
softdepend: [AnarchyCore, AnarchyClans, AnarchyEconomy, AnarchyVanish, LuckPerms, AnarchyRTP]
commands:
  anarchytags:
    description: Gerencia as tags do AnarchyTags
    aliases: [atags]
    usage: /<command> reload|debug
  escondernick:
    description: Ofuscar nick, habilitar linha do nick ou ocultar tag (admin)
    usage: /<command> | habilitar | invisivel [jogador]
permissions:
  anarchytags.admin:
    description: Permite recarregar a configuração do AnarchyTags
    default: op
  anarchytags.nick.ofuscado:
    description: Permite /escondernick (nick ofuscado, cota diária)
    default: true
  anarchytags.nick.ofuscado.view:
    description: Vê nick em &8 de quem usa modo ofuscado
    default: op
  anarchytags.nick.invisible:
    description: Permite /escondernick invisivel (oculta a própria tag)
    default: op
  anarchytags.nick.invisible.others:
    description: Permite /escondernick invisivel <jogador>
    default: op
